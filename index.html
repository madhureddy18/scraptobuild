<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1412">
<meta name="robots" content="noindex">
<title>Scrap To Build Studio</title>
<style>
:root{--bg:#0b1412;--panel:#12201d;--panel2:#1a2c28;--line:#24403a;--text:#eef5f2;--muted:#93aba4;--accent:#ffc53d;--ink:#2a1d00;--ok:#3ecf8e;--bad:#ff6b6b;--blue:#8fb3ff;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 80px}
header{display:flex;align-items:center;gap:10px;padding:6px 0 18px}
.logo{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe08a,#ffc53d 55%,#d99a0b);box-shadow:0 0 18px #ffc53d55;flex:none}
h1{font-size:18px;margin:0;line-height:1.2;min-width:0}
header button{padding:9px 11px;white-space:nowrap;flex:none} h1 small{display:block;font-size:12px;color:var(--muted);font-weight:500}
h2{font-size:16px;margin:0 0 10px}
.spacer{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 15px;background:var(--panel2);color:var(--text)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--ink);font-weight:700}
button.ghost{background:transparent;border:1px solid var(--line)}
button.danger{background:transparent;color:var(--bad);border:1px solid #4a2a2a}
input,textarea{font:inherit;width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px}
textarea{resize:vertical;min-height:96px}
input[type=file]{padding:9px}
label.lbl{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
.muted{color:var(--muted)} .small{font-size:13px}
.chip{display:inline-block;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--panel2);color:var(--muted);white-space:nowrap;font-weight:600}
.chip.wait{background:#1d2433;color:var(--blue)} .chip.ok{background:#12291f;color:var(--ok)} .chip.bad{background:#2c1616;color:var(--bad)} .chip.run{background:#2a2412;color:var(--accent)}
.tabs{display:flex;gap:6px;margin:10px 0 4px} .tabs button{flex:1;padding:10px 6px;font-size:14px}
.tabs button.on{background:var(--accent);color:var(--ink);font-weight:700}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:10px;display:none} .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#000c;border:1px solid var(--line);padding:11px 16px;border-radius:12px;display:none;max-width:92vw;z-index:9}
.item-cap{white-space:pre-wrap;font-size:13px;color:var(--muted);margin-top:8px;max-height:4.5em;overflow:hidden}
video{width:100%;max-height:420px;border-radius:12px;background:#000;margin-top:10px}
.runs div{display:flex;gap:8px;align-items:center;font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.runs div:first-child{border-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{display:block;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit}
.tile:active{transform:scale(.98)}
.thumb{aspect-ratio:9/16;background:#000;display:flex;align-items:center;justify-content:center;font-size:40px;max-height:300px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.tmeta{padding:10px}.ttitle{font-weight:700;font-size:14px;margin:6px 0 2px;line-height:1.3}
.media{display:grid;grid-template-columns:1fr 120px;gap:12px;align-items:start;margin-top:10px}.media video{margin-top:0}
.cover{width:120px;border-radius:10px;border:1px solid var(--line)}
@media (max-width:480px){.media{grid-template-columns:1fr}.cover{width:110px}}
.trim{position:relative;height:34px;border-radius:10px;background:var(--panel2);margin:12px 0 4px;overflow:hidden}
.trim .keep{position:absolute;top:0;bottom:0;background:#ffc53d33;border-left:3px solid var(--accent);border-right:3px solid var(--accent)}
.trim .ph{position:absolute;top:0;bottom:0;width:2px;background:#fff}
.trimrow{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;margin-top:10px}
.trimrow b{font-variant-numeric:tabular-nums}
.trimrow input[type=range]{padding:0;accent-color:var(--accent)}
.nudge{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.nudge button{padding:7px 10px;font-size:13px}
.preview{white-space:pre-wrap;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:14px}
details summary{cursor:pointer;list-style:none}details summary::-webkit-details-marker{display:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast"></div>
<script>
const OWNER = "madhureddy18", REPO = "scraptobuild", API = "https://api.github.com", PAGES = `https://${OWNER}.github.io/${REPO}`;
const $ = s => document.querySelector(s), app = $("#app");
const esc = s => (s ?? "").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} } };
let TOKEN = store.get("stb_token") || "", timer = null, DATA = null;
const DEFAULT_CAP = "\n\nFollow for one money question every day 💰\n#money #finance #india #3danimation";
function toast(m, ms=3000){ const t=$("#toast"); t.textContent=m; t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none", ms); }
const fmt = iso => { try { return new Date(iso).toLocaleString("en-IN",{timeZone:"Asia/Kolkata",weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}); } catch(e){ return iso; } };
const toInput = iso => new Date(new Date(iso).getTime() + 330*60000).toISOString().slice(0,16);
const fromInput = v => v ? v + ":00+05:30" : null;
const b64 = s => btoa(unescape(encodeURIComponent(s)));

async function gh(path, opts={}){
  const r = await fetch(path.startsWith("http") ? path : API + path, { ...opts, headers: { Authorization: "Bearer " + TOKEN,
    Accept: opts.raw ? "application/vnd.github.raw+json" : "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28",
    ...(opts.body ? {"Content-Type":"application/json"} : {}) }, body: opts.body ? JSON.stringify(opts.body) : undefined, cache: "no-store" });
  if (r.status === 404 && opts.allow404) return null;
  if (!r.ok) { let m = ""; try { m = (await r.json()).message; } catch(e){} throw new Error(r.status === 401 ? "GitHub token is wrong or expired" : (m || "GitHub error " + r.status) + (r.status === 403 || r.status === 404 ? " (check the token has Contents + Actions: Read and write)" : "")); }
  if (r.status === 204) return {};
  return opts.raw ? r.text() : r.json();
}
const R = `/repos/${OWNER}/${REPO}`;

// upload a big file as a git blob, with a progress bar
function uploadBlob(file, onProgress){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("Couldn't read the file"));
    fr.onload = () => {
      const x = new XMLHttpRequest();
      x.open("POST", API + R + "/git/blobs");
      x.setRequestHeader("Authorization", "Bearer " + TOKEN); x.setRequestHeader("Accept", "application/vnd.github+json"); x.setRequestHeader("Content-Type", "application/json");
      x.upload.onprogress = e => e.lengthComputable && onProgress(e.loaded / e.total);
      x.onload = () => x.status < 300 ? resolve(JSON.parse(x.responseText).sha) : reject(new Error("Upload failed (" + x.status + ")"));
      x.onerror = () => reject(new Error("Upload failed - check your connection"));
      x.send(JSON.stringify({ content: fr.result.split(",")[1], encoding: "base64" }));
    };
    fr.readAsDataURL(file);
  });
}
// one commit with several changes: [{path, text}|{path, sha}|{path, del:true}]
async function commit(changes, message){
  for (let attempt = 0; attempt < 4; attempt++) {
    const ref = await gh(R + "/git/ref/heads/main"), head = ref.object.sha;
    const base = (await gh(R + "/git/commits/" + head)).tree.sha;
    const tree = [];
    for (const c of changes) {
      if (c.del) tree.push({ path: c.path, mode: "100644", type: "blob", sha: null });
      else if (c.sha) tree.push({ path: c.path, mode: "100644", type: "blob", sha: c.sha });
      else tree.push({ path: c.path, mode: "100644", type: "blob", content: c.text });
    }
    const t = await gh(R + "/git/trees", { method: "POST", body: { base_tree: base, tree } });
    const cm = await gh(R + "/git/commits", { method: "POST", body: { message, tree: t.sha, parents: [head] } });
    try { await gh(R + "/git/refs/heads/main", { method: "PATCH", body: { sha: cm.sha } }); return; }
    catch(e){ if (attempt === 3) throw e; await new Promise(r => setTimeout(r, 1500)); }
  }
}
const cutNow = (id, start, end) => gh(R + "/actions/workflows/cut.yml/dispatches", { method: "POST", body: { ref: "main", inputs: { id, start: start.toFixed(2), end: end.toFixed(2) } } });
const mmss = s => { s = Math.max(0, s || 0); const m = Math.floor(s / 60), r = s - m * 60; return m + ":" + (r < 10 ? "0" : "") + r.toFixed(1); };
const postNow = id => gh(R + "/actions/workflows/post.yml/dispatches", { method: "POST", body: { ref: "main", inputs: { id, dry_run: false } } });

async function load(){
  const list = (await gh(R + "/contents/queue?ref=main", { allow404: true })) || [];
  const vids = list.filter(f => f.name.endsWith(".mp4"));
  const items = await Promise.all(vids.map(async v => {
    const id = v.name.slice(0, -4), j = list.find(f => f.name === id + ".json");
    let meta = {}; if (j) { try { meta = JSON.parse(await gh(R + "/contents/queue/" + j.name + "?ref=main", { raw: true })); } catch(e){} }
    return { ...meta, id, size: v.size, sha: v.sha, hasCover: list.some(f => f.name === id + ".jpg") };
  }));
  const orig = (await gh(R + "/contents/originals?ref=main", { allow404: true })) || [];
  items.forEach(m => { const o = orig.find(f => f.name === m.id + ".mp4"); if (o) m.origSha = o.sha; });
  items.sort((a, b) => (a.at || "9999") < (b.at || "9999") ? -1 : (a.at || "9999") > (b.at || "9999") ? 1 : (a.created || "") < (b.created || "") ? -1 : 1);
  let posted = []; try { posted = JSON.parse((await gh(R + "/contents/posted.json?ref=main", { raw: true, allow404: true })) || "[]"); } catch(e){}
  let runs = []; try { runs = (await gh(R + "/actions/workflows/post.yml/runs?per_page=30")).workflow_runs.filter(r => r.event === "workflow_dispatch" || r.conclusion === "failure").map(r => ({ ...r, kind: "Post" })); } catch(e){}
  try { runs = runs.concat((await gh(R + "/actions/workflows/cut.yml/runs?per_page=10")).workflow_runs.map(r => ({ ...r, kind: "Cut" }))); } catch(e){}
  runs = runs.sort((a, b) => a.created_at < b.created_at ? 1 : -1).slice(0, 6);
  return { items, posted, runs };
}
const tagsOf = str => [...new Set((str || "").split(/[\s,]+/).map(t => t.replace(/^#+/, "").replace(/[^\p{L}\p{N}_]/gu, "")).filter(Boolean))];
const fullCaption = m => { const tags = (m.hashtags || []).slice(0, 5); return ((m.caption || "").trim() + (tags.length ? "\n\n" + tags.map(t => "#" + t).join(" ") : "")).trim(); };
const coverUrl = m => m.hasCover ? `${PAGES}/queue/${encodeURIComponent(m.id)}.jpg` : "";
const chipOf = m => m.trim ? `<span class="chip run">Cutting…</span>` : m.status === "failed" ? `<span class="chip bad">Failed</span>` : m.at ? `<span class="chip wait">Scheduled</span>` : `<span class="chip">Draft</span>`;

function tokenPage(msg){
  clearInterval(timer);
  app.innerHTML = head() + `<div class="card"><h2>Connect your GitHub</h2>
    <div class="small muted">Paste a fine-grained GitHub token for the <b>${REPO}</b> repo with <b>Contents</b> and <b>Actions</b> set to <b>Read and write</b>. It's saved only in this browser.</div>
    ${msg ? `<div class="small" style="color:var(--bad);margin-top:8px">${esc(msg)}</div>` : ""}
    <input id="tok" type="password" placeholder="github_pat_..." style="margin-top:12px" autocomplete="off">
    <button class="primary" id="go" style="margin-top:10px;width:100%">Connect</button></div>`;
  $("#go").onclick = async () => { TOKEN = $("#tok").value.trim(); if (!TOKEN) return;
    try { await gh(R); store.set("stb_token", TOKEN); route(); } catch(e){ tokenPage(e.message); } };
}
const head = (back) => `<header>${back ? `<button class="ghost" onclick="location.hash='#/'" aria-label="Back">←</button>` : `<div class="logo"></div>`}<h1>Scrap To Build Studio<small>@scraptobuild · Instagram</small></h1><span class="spacer"></span>
  ${TOKEN ? `<button class="ghost" onclick="refresh()" aria-label="Refresh">↻</button>${back ? "" : `<button class="ghost" onclick="logout()">Log out</button>`}` : ""}</header>`;
function logout(){ if (!confirm("Log out on this device?")) return; store.set("stb_token", null); TOKEN = ""; tokenPage(); }
async function refresh(){ DATA = null; route(); }

async function getData(force){
  if (!DATA || force) DATA = await load();
  return DATA;
}
async function route(){
  clearInterval(timer);
  if (!TOKEN) return tokenPage();
  const m = location.hash.match(/^#\/i\/([\w-]+)/);
  if (!DATA) app.innerHTML = head(!!m) + `<div class="card muted">Loading…</div>`;
  try { await getData(); } catch(e){ if (/token/.test(e.message)) return tokenPage(e.message); app.innerHTML = head(!!m) + `<div class="card">${esc(e.message)}</div>`; return; }
  m ? itemPage(m[1]) : home();
}
window.onhashchange = route;
const main = () => { DATA = null; route(); };

let MODE = "draft";
function home(){
  const { items, posted, runs } = DATA;
  const running = runs.some(r => r.status !== "completed");
  app.innerHTML = head() + `
  <h2 style="margin:4px 2px 10px">Ready to post (${items.length})</h2>
  ${items.length ? `<div class="grid">${items.map(m => `<a class="tile" href="#/i/${m.id}">
      <div class="thumb">${m.hasCover ? `<img src="${coverUrl(m)}" alt="" loading="lazy">` : `<span>🎬</span>`}</div>
      <div class="tmeta">${chipOf(m)}<div class="ttitle">${esc(m.title || m.name || m.id)}</div>
      <div class="small muted">${m.at ? "⏰ " + esc(fmt(m.at)) : "Tap to post or schedule"}</div></div></a>`).join("")}</div>`
    : `<div class="card small muted">Nothing waiting. New videos from Claude appear here, or add your own below.</div>`}
  ${runs.length ? `<div class="card" style="margin-top:14px"><h2>Recent runs ${running ? '<span class="chip run">running</span>' : ""}</h2><div class="runs">${runs.map(r => `<div>
      <span class="chip ${r.status !== "completed" ? "run" : r.conclusion === "success" ? "ok" : "bad"}">${r.status !== "completed" ? "Running" : r.conclusion === "success" ? "Done" : "Failed"}</span>
      <span>${r.kind === "Cut" ? "✂️ Cut" : "🚀 Post"} · ${esc(fmt(r.created_at))}</span><span class="spacer"></span><a href="${esc(r.html_url)}" target="_blank" rel="noopener">details</a></div>`).join("")}</div></div>` : ""}
  <details class="card" style="margin-top:14px"><summary><b>➕ Add your own video</b></summary>
    <input type="file" id="file" accept="video/mp4,video/*" style="margin-top:12px">
    <label class="lbl">Title (just for you)</label><input id="ntitle" placeholder="e.g. How EMIs work">
    <label class="lbl">Caption</label><textarea id="cap">${esc(DEFAULT_CAP)}</textarea>
    <label class="lbl">Hashtags (max 5)</label><input id="ntags" placeholder="money finance india">
    <label class="lbl">First comment (optional)</label><input id="ncom" placeholder="Question for viewers…">
    <div class="tabs"><button data-m="draft">Save draft</button><button data-m="schedule">Schedule</button><button data-m="now">Post now</button></div>
    <div id="whenBox" style="display:none"><label class="lbl">Post at (India time)</label><input type="datetime-local" id="when"></div>
    <button class="primary" id="add" style="margin-top:12px;width:100%"></button>
    <div class="bar" id="bar"><i></i></div><div class="small muted" id="prog" style="margin-top:6px"></div>
  </details>
  <h2 style="margin:18px 2px 10px">Posted</h2>
  ${posted.length ? posted.slice(0, 30).map(p => `<div class="card" style="padding:12px 16px"><div class="row"><span class="chip ok">Posted</span><b class="small">${esc(p.title || "")}</b><span class="spacer"></span><span class="small muted">${esc(fmt(p.posted))}</span></div>
      <div class="row" style="margin-top:6px">${p.url ? `<a class="small" href="${esc(p.url)}" target="_blank" rel="noopener">Open on Instagram ↗</a>` : ""}${p.comment_error ? `<span class="small muted">· first comment not added</span>` : ""}</div></div>`).join("") : `<div class="card small muted">Nothing posted yet.</div>`}
  <div class="small muted" style="margin-top:18px">Scheduled Reels go out within about 1–2 minutes of the time you pick. "Post now" takes about 1–4 minutes.</div>`;
  const setMode = m => { MODE = m; document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.m === m));
    $("#whenBox").style.display = m === "schedule" ? "block" : "none"; $("#add").textContent = m === "now" ? "Upload & post now" : m === "schedule" ? "Upload & schedule" : "Upload as draft"; };
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => setMode(b.dataset.m)); setMode(MODE);
  $("#add").onclick = addReel;
  if (running) timer = setInterval(async () => { if (!document.activeElement.matches("textarea,input") && !location.hash.startsWith("#/i/")) { DATA = null; route(); } }, 15000);
}

function itemPage(id){
  const m = DATA.items.find(x => x.id === id);
  if (!m) { app.innerHTML = head(true) + `<div class="card">This video isn't in the queue any more (posted or deleted). <a href="#/">Back</a></div>`; return; }
  const tags = (m.hashtags || []);
  app.innerHTML = head(true) + `
  <div class="card">
    <div class="row">${chipOf(m)}<b>${m.at ? "⏰ " + esc(fmt(m.at)) : "Not scheduled"}</b><span class="spacer"></span><span class="small muted">${esc(m.name || m.id)}</span></div>
    ${m.error ? `<div class="small" style="color:var(--bad);margin-top:8px">Last try failed: ${esc(m.error)}</div>` : ""}
    <div class="media">
      <video id="vid" controls playsinline preload="metadata" ${m.hasCover ? `poster="${coverUrl(m)}"` : ""} src="${PAGES}/queue/${encodeURIComponent(id)}.mp4?v=${esc((m.sha || "").slice(0, 10))}"></video>
      ${m.hasCover ? `<div><div class="small muted" style="margin-bottom:6px">Cover</div><img class="cover" src="${coverUrl(m)}" alt="Reel cover"></div>` : ""}
    </div>
  </div>
  ${m.tip ? `<div class="card small" style="border-color:#5a4a14;background:#1d1a0e">💡 ${esc(m.tip)}</div>` : ""}
  <div class="card" id="cutcard"><h2>✂️ Cut video</h2>
    ${m.trim ? `<div class="small" style="color:var(--accent)">Cutting to ${mmss(m.trim.start)} – ${mmss(m.trim.end)}… takes about 1–2 minutes. This page refreshes by itself.</div>`
      : `${m.cut ? `<div class="small muted">Cut on ${esc(fmt(m.cut.at))}: now ${m.cut.length}s. If you still see the old video, wait a minute and tap ↻.</div>` : `<div class="small muted">Drag Start and End, or play the video and tap "Set" at the right moment.</div>`}
      ${m.cut_error ? `<div class="small" style="color:var(--bad);margin-top:6px">${esc(m.cut_error)}</div>` : ""}
      <div class="trim"><div class="keep" id="keep"></div><div class="ph" id="ph"></div></div>
      <div class="small muted" id="trimsum">Loading video…</div>
      <div class="trimrow"><span class="small muted">Start</span><input type="range" id="r_s" min="0" max="1" step="0.1" value="0" disabled><b id="v_s">0:00.0</b></div>
      <div class="nudge"><button class="ghost" data-n="s,-0.1">−0.1s</button><button class="ghost" data-n="s,0.1">+0.1s</button><button id="set_s">Set start = ▶ now</button></div>
      <div class="trimrow"><span class="small muted">End</span><input type="range" id="r_e" min="0" max="1" step="0.1" value="1" disabled><b id="v_e">0:00.0</b></div>
      <div class="nudge"><button class="ghost" data-n="e,-0.1">−0.1s</button><button class="ghost" data-n="e,0.1">+0.1s</button><button id="set_e">Set end = ▶ now</button></div>
      <div class="row" style="margin-top:14px"><button id="c_prev">▶ Preview cut</button><button class="ghost" id="c_reset">Reset</button><span class="spacer"></span><button class="primary" id="c_save">✂️ Save cut</button></div>
      ${m.origSha ? `<button class="ghost" id="c_undo" style="margin-top:10px;width:100%">↩ Undo cut (bring back the original)</button>` : ""}`}
  </div>
  <div class="card">
    <label class="lbl" style="margin-top:0">Title</label><input id="f_title" value="${esc(m.title || "")}">
    <label class="lbl">Caption</label><textarea id="f_cap" style="min-height:220px">${esc(m.caption || "")}</textarea>
    <label class="lbl">Hashtags <span id="tagcount"></span></label><input id="f_tags" value="${esc(tags.map(t => "#" + t).join(" "))}">
    <label class="lbl">First comment (posted right after the Reel)</label><textarea id="f_com" style="min-height:70px">${esc(m.first_comment || "")}</textarea>
    <label class="lbl">Audio name</label><input id="f_audio" value="${esc(m.audio_name || "")}">
    ${(m.keywords || []).length ? `<label class="lbl">Search keywords (already used in the caption)</label><div class="row">${m.keywords.map(k => `<span class="chip">${esc(k)}</span>`).join("")}</div>` : ""}
    <label class="lbl">Exactly what Instagram will show</label>
    <div class="preview" id="f_prev"></div>
    <button class="ghost" id="copy" style="margin-top:8px">📋 Copy caption + hashtags</button>
  </div>
  <div class="card"><h2>Post it</h2>
    <label class="lbl" style="margin-top:0">Schedule for (India time)</label>
    <div class="row"><input type="datetime-local" id="f_at" value="${m.at ? toInput(m.at) : ""}" style="flex:1;min-width:200px"></div>
    <div class="row" style="margin-top:10px">
      <button class="primary" id="b_now" ${m.trim ? "disabled" : ""}>🚀 Post now</button>
      <button id="b_sched" ${m.trim ? "disabled" : ""}>⏰ Schedule</button>
      <button class="ghost" id="b_save">Save changes</button>
      ${m.at ? `<button class="ghost" id="b_unsched">Unschedule</button>` : ""}
      <span class="spacer"></span><button class="danger" id="b_del">Delete</button></div>
  </div>`;
  const read = () => ({ ...metaOf(id), title: $("#f_title").value.trim(), caption: $("#f_cap").value.trim(), hashtags: tagsOf($("#f_tags").value),
    first_comment: $("#f_com").value.trim(), audio_name: $("#f_audio").value.trim() });
  const upd = () => { const t = tagsOf($("#f_tags").value); $("#tagcount").innerHTML = `<span style="color:${t.length > 5 ? "var(--bad)" : "var(--muted)"}">(${t.length}/5${t.length > 5 ? " - Instagram allows 5, extras are dropped" : ""})</span>`;
    $("#f_prev").textContent = fullCaption({ caption: $("#f_cap").value, hashtags: t }); };
  ["f_cap", "f_tags"].forEach(k => $("#" + k).oninput = upd); upd();
  $("#copy").onclick = () => navigator.clipboard.writeText(fullCaption(read())).then(() => toast("Copied"));
  const clean = o => { delete o.status; delete o.error; delete o.tried; return o; };
  const save = async (meta, msg, after) => { try { await writeMeta(id, meta, msg); toast(after, 4000); DATA = null; location.hash.startsWith("#/i/") ? route() : null; } catch(e){ toast(e.message, 6000); } };
  $("#b_save").onclick = () => save(clean({ ...read(), at: m.at || null }), "Update " + id, "Saved");
  $("#b_sched").onclick = () => { const at = fromInput($("#f_at").value); if (!at) return toast("Pick a date and time first");
    if (new Date(at) < new Date() && !confirm("That time has passed - it will post within ~15 minutes. OK?")) return;
    save(clean({ ...read(), at }), "Schedule " + id, "Scheduled for " + fmt(at)); };
  const un = $("#b_unsched"); if (un) un.onclick = () => save(clean({ ...read(), at: null }), "Unschedule " + id, "Moved back to drafts");
  $("#b_now").onclick = async () => { if (!confirm("Post this to Instagram right now?")) return;
    try { await writeMeta(id, clean({ ...read(), at: null }), "Post now " + id); await postNow(id); toast("Posting now - takes 1–4 minutes", 5000); DATA = null; location.hash = "#/"; } catch(e){ toast(e.message, 6000); } };
  $("#b_del").onclick = async () => { if (!confirm("Delete this video from the queue?")) return;
    const ch = [{ path: `queue/${id}.mp4`, del: true }, { path: `queue/${id}.json`, del: true }]; if (m.hasCover) ch.push({ path: `queue/${id}.jpg`, del: true });
    try { await commit(ch, "Delete " + id); toast("Deleted"); DATA = null; location.hash = "#/"; } catch(e){ toast(e.message, 6000); } };
  cutUI(m, read, clean);
}

// ---------- ✂️ cut / trim ----------
function cutUI(m, read, clean){
  const id = m.id;
  if (m.trim) {   // a cut is being made on GitHub: refresh until it lands
    timer = setInterval(async () => { if (document.activeElement.matches("textarea,input")) return; try { const d = await load(); const x = d.items.find(i => i.id === id);
      if (!x || !x.trim) { DATA = d; route(); toast(x && x.cut_error ? "The cut failed" : "Cut done ✂️", 4000); } } catch(e){} }, 15000);
    return;
  }
  const v = $("#vid"), rs = $("#r_s"), re = $("#r_e");
  let D = 0, S = 0, E = 0, previewing = false;
  const draw = () => {
    if (!D) return;
    $("#v_s").textContent = mmss(S); $("#v_e").textContent = mmss(E); rs.value = S; re.value = E;
    $("#keep").style.left = (S / D * 100) + "%"; $("#keep").style.width = ((E - S) / D * 100) + "%";
    const cut = D - (E - S);
    $("#trimsum").innerHTML = `Keeping <b>${mmss(S)} → ${mmss(E)}</b> · ${(E - S).toFixed(1)}s of ${D.toFixed(1)}s` + (cut > 0.05 ? ` <span style="color:var(--bad)">(cutting ${cut.toFixed(1)}s)</span>` : "");
  };
  const setS = x => { S = Math.min(Math.max(0, +x), E - 3); draw(); };
  const setE = x => { E = Math.max(Math.min(D, +x), S + 3); draw(); };
  const ready = () => { if (D) return; D = Math.round(v.duration * 10) / 10 || 0; if (!D) return;
    S = 0; E = D; [rs, re].forEach(r => { r.max = D; r.disabled = false; }); draw(); };
  v.addEventListener("loadedmetadata", ready); if (v.readyState >= 1) ready();
  v.addEventListener("timeupdate", () => { if (!D) return; $("#ph").style.left = (v.currentTime / D * 100) + "%";
    if (previewing && v.currentTime >= E) { v.pause(); previewing = false; } });
  v.addEventListener("pause", () => previewing = false);
  rs.oninput = () => { setS(rs.value); v.currentTime = S; };
  re.oninput = () => { setE(re.value); v.currentTime = E; };
  $("#set_s").onclick = () => setS(Math.round(v.currentTime * 10) / 10);
  $("#set_e").onclick = () => setE(Math.round(v.currentTime * 10) / 10);
  document.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { const [w, d] = b.dataset.n.split(","); if (w === "s") { setS(+(S + +d).toFixed(1)); v.currentTime = S; } else { setE(+(E + +d).toFixed(1)); v.currentTime = E; } });
  $("#c_prev").onclick = () => { if (!D) return; v.currentTime = S; previewing = true; v.play(); };
  $("#c_reset").onclick = () => { S = 0; E = D; draw(); };
  $("#c_save").onclick = async () => {
    if (!D) return toast("Video is still loading");
    if (S < 0.05 && E > D - 0.05) return toast("Move Start or End first - nothing to cut");
    if (!confirm(`Cut the video to ${mmss(S)} – ${mmss(E)} (${(E - S).toFixed(1)}s)?\nYou can undo it later.`)) return;
    try { const meta = clean({ ...read(), at: m.at || null }); delete meta.cut_error; meta.trim = { start: S, end: E, asked: new Date().toISOString() };
      await writeMeta(id, meta, "Cut request " + id); await cutNow(id, S, E);
      toast("Cutting now ✂️ about 1–2 minutes", 5000); DATA = null; route(); } catch(e){ toast(e.message, 6000); } };
  const u = $("#c_undo"); if (u) u.onclick = async () => {
    if (!confirm("Bring back the original, uncut video?")) return;
    try { const meta = clean({ ...read(), at: m.at || null }); delete meta.cut; delete meta.cut_error;
      await commit([{ path: `queue/${id}.mp4`, sha: m.origSha }, { path: `originals/${id}.mp4`, del: true }, { path: `queue/${id}.json`, text: JSON.stringify(meta, null, 1) + "\n" }], "Undo cut " + id);
      toast("Original is back - give it a minute to show", 5000); DATA = null; route(); } catch(e){ toast(e.message, 6000); } };
}

async function addReel(){
  const f = $("#file").files[0]; if (!f) return toast("Pick a video first");
  if (f.size > 95e6) return toast("Video is too big (max ~95 MB)");
  const at = MODE === "schedule" ? fromInput($("#when").value) : null;
  if (MODE === "schedule" && !at) return toast("Pick a date and time");
  if (MODE === "schedule" && new Date(at) < new Date()) return toast("That time is in the past");
  if (MODE === "now" && !confirm("Upload and post this to Instagram right away?")) return;
  const btn = $("#add"), bar = $("#bar"), prog = $("#prog"); btn.disabled = true; bar.style.display = "block";
  const slug = f.name.replace(/\.[^.]+$/, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 30) || "reel";
  const id = slug + "-" + Date.now().toString(36);
  try {
    prog.textContent = `Uploading ${(f.size / 1e6).toFixed(1)} MB…`;
    const sha = await uploadBlob(f, p => { bar.firstChild.style.width = Math.round(p * 100) + "%"; prog.textContent = `Uploading… ${Math.round(p * 100)}%`; });
    prog.textContent = "Saving…";
    const meta = { name: f.name, title: $("#ntitle").value.trim(), caption: $("#cap").value.trim(), hashtags: tagsOf($("#ntags").value).slice(0, 5),
      first_comment: $("#ncom").value.trim(), at, created: new Date().toISOString() };
    await commit([{ path: `queue/${id}.mp4`, sha }, { path: `queue/${id}.json`, text: JSON.stringify(meta, null, 1) + "\n" }], `Add ${f.name}`);
    if (MODE === "now") { await postNow(id); toast("Uploaded - posting now (1–4 min)", 5000); }
    else toast(at ? "Scheduled for " + fmt(at) : "Saved as draft", 4000);
    MODE = "draft"; DATA = null; route();
  } catch(e){ toast(e.message, 6000); btn.disabled = false; bar.style.display = "none"; prog.textContent = ""; }
}
const metaOf = id => { const m = DATA.items.find(x => x.id === id) || {}; const { id: _i, size: _s, hasCover: _c, sha: _h, origSha: _o, ...rest } = m; return rest; };
async function writeMeta(id, meta, msg){ await commit([{ path: `queue/${id}.json`, text: JSON.stringify(meta, null, 1) + "\n" }], msg); }
route();
</script>
