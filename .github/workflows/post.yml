name: Post Reels

# Started by the website's "Post now" button (with an id), and every 15 minutes to post anything you scheduled.
# Nothing is ever posted unless you scheduled it or pressed "Post now" on the website.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      id:
        description: "Video id to post now (empty = whatever is scheduled and due)"
        type: string
        default: ""
      dry_run:
        description: "Dry run (check only, don't post)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: post-reel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - name: Anything to do?
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=1" >> $GITHUB_OUTPUT; exit 0; fi
          if python3 -c "import post,sys; sys.exit(0 if post.due_items() else 1)" 2>/dev/null; then echo "go=1" >> $GITHUB_OUTPUT; else echo "Nothing scheduled right now."; fi
      - if: steps.check.outputs.go == '1'
        name: Post to Instagram
        env:
          IG_TOKEN: ${{ secrets.MADDIEANDCHOTUIGTOKEN }}
          POST_ID: ${{ inputs.id }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python post.py
      - if: always() && steps.check.outputs.go == '1'
        name: Update the queue
        run: |
          git config user.name "scraptobuild-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A queue posted.json; git add -A originals 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Post update $(date -u +%F' '%H:%M)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
