name: voices (OmniVoice)
on:
  workflow_dispatch:
    inputs:
      config: { description: 'Voice config JSON in the repo', default: 'studio/voices/samples.json' }
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: command -v ffmpeg || (for i in 1 2 3; do timeout 180 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq ffmpeg && break; sleep 10; done)
        timeout-minutes: 15
      - run: pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu && pip install -q omnivoice
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: hf-omnivoice-v1 }
      - run: mkdir -p out && cp -r studio/voices/refs out/ 2>/dev/null || true; SHARD=${{ matrix.shard }} NSHARDS=3 python studio/voices/omnivoice_gen.py "${{ github.event.inputs.config }}" out
      - name: Push results to the voices-out branch
        run: |
          cd out && rm -f option?.wav && mkdir -p autodm && echo '{"git":{"deploymentEnabled":false}}' > autodm/vercel.json && git init -q && git checkout -q -b voices-out-${{ matrix.shard }}
          git -c user.name=voices-bot -c user.email=bot@users.noreply.github.com add -A
          git -c user.name=voices-bot -c user.email=bot@users.noreply.github.com commit -qm "voices ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" voices-out-${{ matrix.shard }}
